name: JS-safe ping

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Hit endpoint with real browser
        env:
          TOKEN: B3TT3RLIF3_UPDAT3_T0K3N
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(
              'https://betterlife.wuaze.com/data.php?update=true&token=' + process.env.TOKEN,
              { waitUntil: 'networkidle', timeout: 120000 }
            );
            await browser.close();
          })();
          "
